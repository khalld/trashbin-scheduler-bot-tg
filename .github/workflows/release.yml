name: Release

# On a version tag (vX.Y.Z) push:
#   1. build the single-file bundle and attach it to a GitHub Release
#   2. publish the package to the public npm registry (unscoped name)
#   3. publish the package to GitHub Packages (scoped @owner name) so it shows
#      in the repository's "Packages" section
# The tag's annotation message becomes the release notes, so create annotated
# tags: `git tag -a vX.Y.Z -m "..."`.
#
# Requires repo secret NPM_TOKEN (an npm "Automation" access token) for the
# npm.js publish. Without it, the GitHub Release and GitHub Packages publish
# still run and only the npm.js publish is skipped. GitHub Packages uses the
# built-in GITHUB_TOKEN, so no extra secret is needed.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build single-file bundle
        run: npm run build

      - name: Package bundle for release
        run: cp dist/index.js trashbin-bot.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trashbin-bot.js \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish

      # Re-publish under the @owner scope to GitHub Packages so the package is
      # listed on the repository. Uses the built-in GITHUB_TOKEN.
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          npm pkg set name="@${OWNER,,}/trashbin-scheduler-bot-tg"
          printf '@%s:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n' "${OWNER,,}" "$NODE_AUTH_TOKEN" > .npmrc
          npm publish
