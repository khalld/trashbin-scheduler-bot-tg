name: Release

# On a version tag (vX.Y.Z) push:
#   1. build the single-file bundle and attach it to a GitHub Release
#   2. publish the package to the npm registry
# The tag's annotation message becomes the release notes, so create annotated
# tags: `git tag -a vX.Y.Z -m "..."`.
#
# Requires repo secret NPM_TOKEN (an npm "Automation" access token) for the
# publish step. Without it, the GitHub Release is still created and only the
# npm publish is skipped.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build single-file bundle
        run: npm run build

      - name: Package bundle for release
        run: cp dist/index.js trashbin-bot.js

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" trashbin-bot.js \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag

      - name: Publish to npm
        if: ${{ env.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish
